name: 房态监控

on:
  schedule:
    # 保险绳：每 15 分钟一次。主节奏由「链式触发」（最后一步）负责，约每 5 分钟一轮。
    # GitHub 定时器高峰期会延迟/跳过，链式触发不受平台调度器影响。
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:        # 也可以在网页上手动点一次

# 同一时间只跑一个，避免两次任务抢浏览器和 state.json
concurrency:
  group: yosemite-watch
  cancel-in-progress: false

permissions:
  contents: write           # 需要把 state.json 提交回去（去重用）
  actions: write            # 链式触发：跑完自动叫醒下一轮

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装系统的虚拟屏幕与中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-noto-cjk

      - name: 装 Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 查询并推送
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          TZ: Asia/Shanghai
        run: |
          xvfb-run -a --server-args="-screen 0 1400x900x24" node cli.js --verbose

      - name: 保存状态（去重记录）
        if: always()
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          if [ -f state.json ]; then
            git add -f state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update state [skip ci]"
              git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
              git push || echo "push 失败（下次运行会再试）"
            else
              echo "状态未变化"
            fi
          else
            echo "没有 state.json"
          fi

      - name: 链式触发下一轮（自叫醒，约 5 分钟一轮）
        if: always()
        run: |
          sleep 240
          # 急停开关：在 state.json 里加 "haltChain": true 即可停止链式触发
          if [ -f state.json ] && grep -q '"haltChain"[[:space:]]*:[[:space:]]*true' state.json; then
            echo "检测到 haltChain=true，停止链式触发"
            exit 0
          fi
          curl -sS -o /dev/null -w "链式触发 HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/watch.yml/dispatches" \
            -d '{"ref":"main"}'
